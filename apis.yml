name: Grand Games
description: 'Grand Games (Grand Games Oyun ve Yazılım) is an Istanbul-based hybrid-casual
  mobile game studio founded in early 2024 by Bekir Batuhan Çelebi, Mehmet Çalım, and
  Mustafa Fırtına, a team that previously built Zen Match at Moon Active. The studio
  develops genre-defining puzzle games for iOS and Android played by millions worldwide,
  including Magic Sort, Car Match, and Block Out, and has grown to six live titles with
  fivefold year-over-year revenue. It has raised roughly $103M across three rounds, most
  recently a $70M Series B led by Balderton Capital''s Growth Fund in May 2026. Grand
  Games publishes consumer mobile games and does not currently expose a public developer
  API, SDK, or developer portal.'
